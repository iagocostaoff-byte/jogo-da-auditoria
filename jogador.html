<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#11151C">
<title>Trilha de Auditoria · Equipe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bitter:wght@600;800&display=swap">
<style>
/* Trilha de Auditoria · tela do celular (capitão e torcida). Licença MIT. */
/* Layout: uma coluna, faixa da equipe no topo, ação principal sempre em
   botão grande na parte de baixo da área visível. */
:root{
  color-scheme: dark;
  --room:#11151C; --panel:#1A2029; --panel-2:#232B36; --line:rgba(226,232,240,.13);
  --ink:#EEECE6; --ink-soft:#A3ABB8;
  --paper:#F3F0E7; --paper-2:#E6E1D3; --paper-ink:#1B2230; --paper-soft:#5C6170;
  --ok:#2F8A5C; --bad:#B4433A; --stamp:#9E3A31;
  --team:#F3F0E7; --team-ink:#1B2230;
  --f-display:'Bitter', Rockwell, Georgia, serif;
  --f-body:'Atkinson Hyperlegible', 'Segoe UI', Roboto, Arial, sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  margin:0;background:var(--room);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.4;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:12px 28px;
  transition:filter .7s ease;
}
body.pb #main{filter:grayscale(1) contrast(.96)}
.letreiro{position:fixed;inset:0;z-index:60;pointer-events:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,transparent 36%,rgba(8,10,14,.88) 44%,rgba(8,10,14,.88) 56%,transparent 64%);animation:letreiroIn 2s ease both}
.letreiro img{width:88vw;max-width:520px;height:auto}
@keyframes letreiroIn{0%{opacity:0;transform:scale(1.15)}15%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.letreiro{display:none}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--room)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--paper);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.brand{display:flex;justify-content:space-between;align-items:baseline;gap:10px;color:var(--ink-soft);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.brand b{font-family:var(--f-display);text-transform:none;letter-spacing:0;color:var(--ink);font-size:17px}

.teamband{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  background:var(--team);color:var(--team-ink);border-radius:14px;padding:12px 14px;
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;
  box-shadow:0 8px 20px rgba(0,0,0,.35);
}
.teamband .tn{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1;overflow-wrap:anywhere}
.teamband .role{font-size:13px;font-weight:700;opacity:.85}
.teamband .pts{grid-row:1/3;grid-column:2;text-align:right;font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1}
.teamband .pts small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.status{font-size:15px;color:var(--ink-soft)}
.status b{color:var(--ink)}
.big{width:100%;border-radius:14px;padding:18px;font-weight:700;font-size:20px;background:var(--paper);color:var(--paper-ink)}
.big.team{background:var(--team);color:var(--team-ink);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2)}
.big.ghost{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);font-size:16px;padding:14px}
.big:disabled{opacity:.5}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:15px}
.field input{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:12px;font:inherit;font-size:18px}
.teams{display:grid;gap:8px}
.tpick{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;
  background:var(--panel-2);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:12px;padding:12px;
}
.tpick b{font-size:18px;display:block}
.tpick span{font-size:13px;color:var(--ink-soft)}
.tpick em{font-style:normal;font-size:12px;font-weight:700;color:var(--ink-soft)}
.chip{min-width:34px;height:34px;padding:0 6px;border-radius:17px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;border:2px solid #14181F}

.card{background:var(--paper);color:var(--paper-ink);border-radius:16px;overflow:hidden}
.card-band{background:var(--paper-ink);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.card-band.real{background:#262A36}
.card-band b{font-family:var(--f-display);font-size:18px}
.card-band small{display:block;font-size:12px;opacity:.85}
.timer{font-family:var(--f-display);font-weight:800;font-size:26px;min-width:2ch;text-align:right}
.timer.warn{color:#FFD2CA}
.card-body{padding:14px;display:flex;flex-direction:column;gap:12px}
.ctx{margin:0;color:var(--paper-soft);border-left:4px solid var(--paper-ink);padding-left:10px;font-size:15px}
.q{margin:0;font-size:20px;font-weight:700;line-height:1.3}
.alts{display:grid;gap:8px}
.alt{
  display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;text-align:left;width:100%;
  background:#fff;border:2px solid #D8D2C2;border-radius:12px;padding:12px;font-size:17px;color:var(--paper-ink);min-height:56px;
}
.alt .lt{width:34px;height:34px;border-radius:9px;background:var(--paper-ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:var(--f-display)}
.alt.sent{border-color:var(--paper-ink);background:#E9E5DA}
.alt.right{background:#DCEFE3;border-color:var(--ok)}
.alt.right .lt{background:var(--ok)}
.alt.partial{background:#F6E9C9;border-color:#C8962E}
.alt.partial .lt{background:#C8962E}
.alt.wrong{background:#F5DCD8;border-color:var(--bad)}
.alt.wrong .lt{background:var(--bad)}
.alt.dim{opacity:.5}
.alt:disabled{cursor:default}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vf button{border-radius:14px;padding:22px 10px;font-family:var(--f-display);font-weight:800;font-size:22px;background:#fff;border:3px solid #D8D2C2;color:var(--paper-ink)}
.vf button.sel{border-color:var(--paper-ink);background:#E9E5DA}
.vf button.right{border-color:var(--ok);background:#DCEFE3}
.note{font-size:14px;color:var(--paper-soft)}
.verdict{border-radius:12px;padding:14px;font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.25;color:#fff}
.verdict.ok{background:#1E6A45}
.verdict.no{background:#2A2E37}
.verdict small{display:block;font-family:var(--f-body);font-weight:400;font-size:14px;opacity:.85;margin-top:4px}
.explain{background:var(--paper-2);border-radius:12px;padding:12px;font-size:15px}
.joke{border:2px dashed var(--stamp);border-radius:12px;padding:10px 12px;font-size:15px;background:#fff}
.joke b{display:block;font-family:var(--f-display);color:var(--stamp);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.keys{margin:0;padding-left:1.2em;font-size:15px}

.scores{display:flex;flex-direction:column;gap:6px}
.srow{display:grid;grid-template-columns:24px auto minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--panel-2);border-radius:10px;padding:8px 10px;border-left:5px solid var(--c)}
.srow.me{outline:2px solid var(--paper-2)}
.srow .rk{color:var(--ink-soft);font-weight:700}
.srow b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .p{font-family:var(--f-display);font-weight:800;font-size:20px}
.title{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px}
.av-box{display:flex;flex-direction:column;gap:10px}
.av-top{display:flex;align-items:center;gap:12px}
.av-prev{width:58px;height:58px;border-radius:50%;border:4px solid var(--team,#888);background:#F4F1EA;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:30px;flex:none;color:#14181F;font-weight:800}
.av-prev img{width:100%;height:100%;object-fit:cover}
.av-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.av-grid button{font-size:24px;padding:6px 0;border-radius:10px;background:var(--panel-2,#222);border:2px solid transparent}
.av-grid button.sel{border-color:var(--team,#fff)}
.av-acts{display:flex;gap:8px;flex-wrap:wrap}
.av-acts button{flex:1;padding:10px;border-radius:10px;font-weight:700;background:var(--panel-2,#222);border:1px solid var(--line,#444)}
.link + .link{margin-left:18px}
.link{color:var(--ink-soft);text-decoration:underline;font-size:14px;padding:6px 0;align-self:center}
.die{font-family:var(--f-display);font-size:64px;font-weight:800;text-align:center;line-height:1}
.center{text-align:center}
.place{font-family:var(--f-display);font-weight:800;font-size:56px;text-align:center;line-height:1}
@media (prefers-reduced-motion:reduce){ body{transition:none} }
</style>
</head>
<body>
<main id="main">
  <div class="brand"><b>Trilha de Auditoria</b><span id="sala-label">FACC · UFRJ</span></div>
  <div id="view"></div>
</main>

<input type="file" id="foto" accept="image/*" hidden>
<script src="js/firebase-config.js?v=9"></script>
<script src="js/vendor/firebase-app-compat.js"></script>
<script src="js/vendor/firebase-database-compat.js"></script>
<script src="js/vendor/mqtt.min.js"></script>
<script src="js/rede.js?v=9"></script>
<script>
/* ==================================================================
   Tela do celular. O capitão (primeiro celular de cada equipe) lança o
   dado e responde; os demais acompanham. Quem decide tudo é a TV.
   ================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LETRAS = ['A', 'B', 'C', 'D', 'E'];
function textColor(hex){
  const n = parseInt(String(hex).slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.299*r + 0.587*g + 0.114*b) > 150 ? '#14181F' : '#FFFFFF';
}
function ls(k, v){ try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }

const params = new URLSearchParams(location.search);
let salaCod = (params.get('sala') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 6);
let pid = params.get('pid') || ls('trilha-pid');   // ?pid= só serve para testes
if(!pid){ pid = 'p' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); ls('trilha-pid', pid); }
let me = { nome: ls('trilha-nome') || '', equipe: null };
const EMOJIS = ['🦁','🐺','🦊','🐯','🦉','🦈','🐉','🐙','🦅','🐝','🕵️','🧮','📊','💼','🔍','🧾','💸','⚖️','☕','🍕','👑','🚀','🔥','🎯'];
let letreirosVistos = {};
function letreiro(arq, chave){
  if(letreirosVistos[chave]) return;
  letreirosVistos[chave] = true;
  const d = document.createElement('div'); d.className = 'letreiro';
  d.innerHTML = `<img src="img/${arq}.png?v=${Rede.VERSAO}" alt="">`;
  document.body.appendChild(d); setTimeout(() => d.remove(), 2100);
  if(navigator.vibrate) try{ navigator.vibrate(180); }catch(e){}
}
/* RESSALVADO quando a própria equipe erra; ELIMINADO quando sai do mata-mata */
function checaLetreiros(){
  if(!est) return;
  const c = est.carta;
  if(est.pb && est.piada && est.piada.tipo === 'no' && c && me.equipe != null && c.who === me.equipe)
    letreiro('ressalvado', 'r:' + c.id + ':' + c.who + ':' + est.piada.txt);
  const mm = est.mm;
  if(est.fase === 'matamata' && mm && mm.stage !== 'pergunta'){
    const eu = (mm.participantes || []).find(p => p.pid === pid);
    if(eu && !eu.vivo && eu.saiu === mm.rodada) letreiro('eliminado', 'e:' + mm.id);
  }
}
let avatarAberto = false, avatarEnviando = false, avatarErro = '', avatarPend = null;
let conn = null, est = null, enviado = {}, achou = false, conectado = null, erroRede = null, esperou = false;

Rede.init();

function conectar(){
  $('#sala-label').textContent = 'Sala ' + salaCod;
  const salvo = ls('trilha-equipe-' + salaCod + '-' + pid);
  if(salvo !== null && salvo !== '') me.equipe = Number(salvo);
  conn = Rede.entrar(salaCod, pid, { nome: me.nome, equipe: me.equipe == null ? -2 : me.equipe }, {
    onEstado(e){ est = e; if(e) achou = true; render(); checaLetreiros(); },
    onConexao(ok){ conectado = ok; if(!ok && est) toast('Sem conexão. Tentando de novo…'); },
    onErro(e){ erroRede = e; render(); }
  });
  render();
  setTimeout(() => { esperou = true; if(!achou) render(); }, 6000);
}

function escolher(t){
  me.equipe = t;
  const inp = $('#nome'); if(inp){ me.nome = inp.value.trim().slice(0, 20); ls('trilha-nome', me.nome); }
  ls('trilha-equipe-' + salaCod + '-' + pid, String(t));
  conn.atualizar({ equipe: t, nome: me.nome });
  render();
}
function trocar(){ me.equipe = null; ls('trilha-equipe-' + salaCod + '-' + pid, ''); conn.atualizar({ equipe: -2 }); render(); }
function enviar(msg){ if(conn) conn.enviar(msg); }

let toastT = null;
function toast(t){ const s = $('#status-extra'); if(s){ s.textContent = t; clearTimeout(toastT); toastT = setTimeout(() => { if(s) s.textContent = ''; }, 3000); } }

/* ---------------- Telas ---------------- */
function render(){
  const inp = $('#nome'), foco = document.activeElement && document.activeElement.id === 'nome';
  if(inp) me.nome = inp.value;
  renderTela();
  const novo = $('#nome');
  if(foco && novo){ novo.focus(); novo.setSelectionRange(novo.value.length, novo.value.length); }
}
function renderTela(){
  document.body.classList.toggle('pb', !!(est && est.pb));
  const v = $('#view');
  if(Rede.modo === 'off'){
    v.innerHTML = `<div class="panel"><h2>Não foi possível conectar</h2><p class="status">Este jogo precisa estar publicado com o Firebase configurado. Peça ao professor para conferir o README.</p></div>`;
    return;
  }
  if(!salaCod){ v.innerHTML = telaCodigo(); bindCodigo(); return; }
  if(!est){
    const diag = (esperou || erroRede || Rede.modo === 'local') ? `<p class="status" style="text-align:left;background:#3a2422;border-radius:10px;padding:10px 12px;color:#F2C0BA">${esc(Rede.explicar({ erro: erroRede, conectado }))}</p>` : '<p class="status">Conectando…</p>';
    v.innerHTML = `<div class="panel center"><h2>Procurando a sala ${esc(salaCod)}…</h2>${diag}<button class="link" id="outro">Digitar outro código</button></div>`;
    $('#outro').onclick = () => { salaCod = ''; if(conn) conn.sair(); conn = null; render(); };
    return;
  }
  if(est.fase === 'encerrada'){ v.innerHTML = `<div class="panel center"><h2>Esta sala foi encerrada</h2><p class="status">Obrigado por jogar.</p></div>`; return; }
  if(me.equipe == null || me.equipe < -1 || (me.equipe >= 0 && !est.equipes[me.equipe])){ v.innerHTML = telaEquipe(); bindEquipe(); return; }
  const eq = me.equipe >= 0 ? est.equipes[me.equipe] : null;
  if(eq){
    document.documentElement.style.setProperty('--team', eq.cor);
    document.documentElement.style.setProperty('--team-ink', textColor(eq.cor));
  }
  const cap = eq && eq.capitao === pid;
  let h = eq ? `<div class="teamband"><div class="tn">${esc(eq.nome)}${eq.semRessalvas ? ' · Sem ressalvas' : ''}</div><div class="role">${cap ? 'Você é o capitão: você lança o dado e responde' : `Torcida${eq.capNome ? ` · capitão: ${esc(eq.capNome)}` : ''}`}</div><div class="pts num">${eq.pts}<small>pontos</small></div></div>`
    : `<div class="panel"><b>Só assistindo</b><div class="status">Você acompanha a partida sem equipe.</div></div>`;

  if(est.versao !== Rede.VERSAO) h += `<div class="panel" style="border-color:#B4433A"><b>Versões diferentes</b><div class="status">A TV e este celular estão com versões diferentes do jogo. Peça para o professor recarregar a TV (Ctrl+Shift+R) e recarregue esta página.</div></div>`;
  if(est.fase === 'matamata'){ h += telaMataMata(); v.innerHTML = h; bindMataMata(); return; }
  if(est.fase === 'lobby'){
    h += `<div class="panel center"><h2>Pronto!</h2><p class="status">Aguarde o professor começar a partida.</p></div>${cap ? avatarHtml(eq, true) : ''}${placar()}`;
  } else if(est.fase === 'apurando'){
    h += `<div class="panel center"><h2>Apurando o parecer…</h2><p class="status">Olhe para a TV: o pódio vai ser revelado.</p></div>`;
  } else if(est.fase === 'fim'){
    h += telaFim();
  } else {
    h += `<div class="panel"><div class="status" id="status">${statusLinha(eq, cap)}</div><div class="status" id="status-extra"></div></div>`;
    h += acaoPrincipal(eq, cap);
    h += cartaHtml(eq, cap);
    h += placar();
    if(cap) h += avatarAberto ? avatarHtml(eq, false) : `<button class="link" id="av-abrir">Imagem do pino da equipe</button>`;
  }
  h += `<button class="link" id="trocar">Trocar de equipe</button>`;
  v.innerHTML = h;
  bindJogo(cap);
}

function telaCodigo(){
  return `<div class="panel"><h2>Entrar na sala</h2><p class="status">Digite o código que aparece na TV.</p>
    <div class="field"><label for="cod">Código da sala</label><input id="cod" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="ABCD"></div>
    <div style="height:10px"></div><button class="big" id="entrar">Entrar</button></div>`;
}
function bindCodigo(){
  const go = () => { const c = $('#cod').value.toUpperCase().replace(/[^A-Z]/g, ''); if(c.length >= 4){ salaCod = c; conectar(); } };
  $('#entrar').onclick = go; $('#cod').onkeydown = e => { if(e.key === 'Enter') go(); };
}

function telaEquipe(){
  const lista = est.equipes.map((e, i) => `<button class="tpick" data-t="${i}" style="--c:${e.cor}">
      <span class="chip" style="background:${e.cor};color:${textColor(e.cor)}">${esc(e.sigla)}</span>
      <span><b>${esc(e.nome)}</b><span>${e.membros ? `${e.membros} no celular · capitão: ${esc(e.capNome || '')}` : 'Ninguém ainda: você será o capitão'}</span></span>
      <em>Entrar</em></button>`).join('');
  return `<div class="panel"><h2>Escolha sua equipe</h2>
    <div class="field" style="margin-top:12px"><label for="nome">Seu nome (aparece na TV)</label><input id="nome" maxlength="20" value="${esc(me.nome)}" placeholder="Ex.: Ana"></div></div>
    <div class="teams">${lista}</div>
    <button class="big ghost" id="assistir">Só assistir</button>`;
}
function bindEquipe(){
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => escolher(+b.dataset.t));
  $('#assistir').onclick = () => escolher(-1);
}

function statusLinha(eq, cap){
  const vez = est.equipes[est.vez];
  const minha = eq && est.vez === me.equipe;
  const rl = est.relogio;
  const r = rl ? `Rodada ${est.rodada} · ${rl.acabou ? 'rodada final' : Math.floor(rl.restante/60) + ':' + String(rl.restante % 60).padStart(2, '0') + ' de jogo'}` : `Rodada ${est.rodada} de ${est.rodadas}`;
  if(est.turno === 'rolling') return `${r} · <b>${esc(vez.nome)}</b> está lançando o dado…`;
  if(est.turno === 'moving') return `${r} · <b>${esc(vez.nome)}</b> tirou ${est.dado} e está andando…`;
  if(est.turno === 'skip') return `${r} · <b>${esc(vez.nome)}</b> perde esta vez.`;
  if(est.turno === 'idle') return minha ? `${r} · <b>É a vez da sua equipe!</b>` : `${r} · Vez de <b>${esc(vez.nome)}</b>.`;
  return `${r} · Vez de <b>${esc(vez.nome)}</b>.`;
}

function acaoPrincipal(eq, cap){
  if(!cap || est.vez !== me.equipe) return '';
  if(est.turno === 'idle') return `<button class="big team" id="dado">Lançar o dado</button>`;
  if(est.turno === 'rolling' || est.turno === 'moving') return `<div class="panel center"><div class="die">${est.turno === 'moving' ? est.dado : '…'}</div></div>`;
  return '';
}

function timerHtml(){
  const t = est.timer; if(!t) return '';
  return `<span class="timer num ${t.left <= 10 ? 'warn' : ''}">${t.left}</span>`;
}
function verdict(){
  const p = est.piada; if(!p) return '';
  return `<div class="verdict ${p.tipo}">${esc(p.txt)}${p.sub ? `<small>${esc(p.sub)}</small>` : ''}</div>`;
}

function cartaHtml(eq, cap){
  const c = est.carta; if(!c) return '';
  const quem = est.equipes[c.who];
  if(c.kind === 'q'){
    const key = c.id + ':' + c.who + ':' + c.wrong.length;
    const podeResponder = cap && c.stage === 'answer' && c.who === me.equipe && c.pending == null && !enviado[key];
    const podeRoubar = cap && c.stage === 'steal' && (c.podemRoubar || []).includes(me.equipe);
    let h = `<div class="card"><div class="card-band ${c.tipo === 'real' ? 'real' : ''}"><span><b>${esc(c.titulo)}</b><small>${esc(c.nivel)} · ${c.pontos} pontos · responde ${esc(quem.nome)}</small></span>${c.stage === 'answer' ? timerHtml() : ''}</div><div class="card-body">`;
    if(c.contexto) h += `<p class="ctx">${esc(c.contexto)}</p>`;
    h += `<p class="q">${esc(c.pergunta)}</p>`;
    if(c.stage !== 'answer' || c.wrong.length) h += verdict();
    h += `<div class="alts">` + c.alternativas.map((a, i) => {
      let cls = '';
      if(c.stage === 'reveal') cls = i === c.correta ? 'right' : (c.parcial && c.parcial[i] ? 'partial' : (c.wrong.includes(i) ? 'wrong' : 'dim'));
      else if(c.wrong.includes(i)) cls = 'wrong';
      if(c.pending === i || enviado[key] === i) cls = 'sent';
      return `<button class="alt ${cls}" data-alt="${i}" ${podeResponder && !c.wrong.includes(i) ? '' : 'disabled'}><span class="lt">${LETRAS[i]}</span><span>${esc(a)}</span></button>`;
    }).join('') + `</div>`;
    if(c.stage === 'answer'){
      if(podeResponder) h += `<p class="note">Discutam e toque na resposta da equipe. Não dá para voltar atrás.</p>`;
      else if(c.who === me.equipe && !cap) h += `<p class="note">Ajude a equipe: quem responde é o capitão.</p>`;
      else if(c.pending != null || enviado[key] !== undefined) h += `<p class="note">Resposta enviada. Olhe para a TV!</p>`;
    }
    if(podeRoubar) h += `<button class="big team" id="repasse">Roubar evidência (vale ${c.rouboVale})</button><p class="note">Cada equipe só pode roubar uma vez por partida.</p>`;
    else if(c.stage === 'steal') h += `<p class="note">${cap && eq && eq.roubos <= 0 && c.who !== me.equipe ? 'Sua equipe já usou o Roubo de Evidência.' : 'Roubo de Evidência aberto para as outras equipes.'}</p>`;
    if(c.stage === 'reveal'){
      h += `<div class="explain">${esc(c.explicacao)}</div>`;
      if(c.piadaCaso) h += `<div class="joke"><b>Para descontrair</b>${esc(c.piadaCaso)}</div>`;
    }
    return h + `</div></div>`;
  }
  if(c.kind === 'rel'){
    const respondeu = c.responderam.includes(me.equipe) || enviado[c.id] !== undefined;
    const pode = cap && c.stage === 'answer' && !respondeu;
    let h = `<div class="card"><div class="card-band"><span><b>Relâmpago: todas as equipes</b><small>Verdadeiro ou falso · 10 pontos</small></span>${c.stage === 'answer' ? timerHtml() : ''}</div><div class="card-body"><p class="q">${esc(c.afirmacao)}</p>`;
    const sel = enviado[c.id];
    h += `<div class="vf"><button data-vf="1" class="${sel === true ? 'sel' : ''} ${c.resposta === true ? 'right' : ''}" ${pode ? '' : 'disabled'}>Verdadeiro</button><button data-vf="0" class="${sel === false ? 'sel' : ''} ${c.resposta === false ? 'right' : ''}" ${pode ? '' : 'disabled'}>Falso</button></div>`;
    if(c.stage === 'answer') h += `<p class="note">${pode ? 'O capitão responde pela equipe.' : respondeu ? 'Resposta enviada.' : 'Quem responde é o capitão.'}</p>`;
    else h += `<div class="explain">${esc(c.explicacao)}</div>`;
    return h + `</div></div>`;
  }
  if(c.kind === 'dil'){
    let h = `<div class="card"><div class="card-band"><span><b>Dilema ético</b><small>Responde ${esc(quem.nome)} em voz alta · até 40 pontos</small></span>${c.stage === 'debate' ? timerHtml() : ''}</div><div class="card-body"><p class="ctx">${esc(c.situacao)}</p><p class="q">${esc(c.pergunta)}</p>`;
    if(c.stage === 'done') h += verdict();
    if(c.pontos) h += `<div class="explain"><b>Pontos-chave esperados</b><ul class="keys">${c.pontos.map(p => `<li>${esc(p)}</li>`).join('')}</ul></div>`;
    return h + `</div></div>`;
  }
  return `<div class="card"><div class="card-band"><span><b>${c.kind === 'ev' ? 'Sorte ou revés' : 'Perde a vez'}</b><small>${esc(quem.nome)}</small></span></div><div class="card-body"><p class="q">${esc(c.titulo)}</p><p class="ctx">${esc(c.texto)}</p><p class="q">${esc(c.efeito)}</p></div></div>`;
}

function placar(){
  const ord = est.equipes.map((e, i) => ({ e, i })).sort((a, b) => b.e.pts - a.e.pts || b.e.ok - a.e.ok || a.e.err - b.e.err);
  return `<div class="panel"><div class="title">Placar</div><div class="scores">${ord.map((o, k) => `<div class="srow ${o.i === me.equipe ? 'me' : ''}" style="--c:${o.e.cor}"><span class="rk">${k+1}º</span><span class="chip" style="background:${o.e.cor};color:${textColor(o.e.cor)}">${esc(o.e.sigla)}</span><b>${esc(o.e.nome)}</b><span class="p num">${o.e.pts}</span></div>`).join('')}</div></div>`;
}

function telaMataMata(){
  const mm = est.mm || {}, eu = (mm.participantes || []).find(p => p.pid === pid);
  let h = `<div class="card"><div class="card-band real"><span><b>Mata-mata: Auditor-Sócio</b><small>${mm.rodada ? 'Pergunta ' + mm.rodada : 'Prepare-se'} · ${(mm.participantes || []).filter(p => p.vivo).length} na disputa</small></span>${mm.stage === 'pergunta' && mm.timer ? `<span class="timer num ${mm.timer.left <= 5 ? 'warn' : ''}">${mm.timer.left}</span>` : ''}</div><div class="card-body">`;
  if(mm.vencedor){
    h += `<div class="verdict ok">${mm.vencedor.pid === pid ? 'Você é o Auditor-Sócio!' : esc(mm.vencedor.nome) + ' é o Auditor-Sócio.'}</div>`;
  } else if(!eu){
    h += `<p class="note">Você assiste: quem disputa são os integrantes da equipe vencedora.</p>`;
  } else if(!eu.vivo){
    h += `<div class="verdict no">Você foi eliminado na pergunta ${eu.saiu || ''}.<small>Fique de olho na TV.</small></div>`;
  }
  if(mm.pergunta && !mm.vencedor){
    const resp = enviado['mm' + mm.rodada];
    const pode = eu && eu.vivo && mm.stage === 'pergunta' && resp === undefined;
    h += `<p class="q">${esc(mm.pergunta)}</p><div class="alts">` + mm.alternativas.map((a, i) => {
      let cls = '';
      if(mm.stage !== 'pergunta' && mm.correta != null) cls = i === mm.correta ? 'right' : (resp === i ? 'wrong' : 'dim');
      else if(resp === i) cls = 'sent';
      return `<button class="alt ${cls}" data-mm="${i}" ${pode ? '' : 'disabled'}><span class="lt">${LETRAS[i]}</span><span>${esc(a)}</span></button>`;
    }).join('') + `</div>`;
    if(pode) h += `<p class="note">Rápido: na final, empate se decide pela velocidade.</p>`;
    else if(resp !== undefined && mm.stage === 'pergunta') h += `<p class="note">Resposta enviada. Olhe para a TV!</p>`;
    if(mm.msg && mm.stage !== 'pergunta') h += `<div class="explain">${esc(mm.msg)}</div>`;
  } else if(!mm.vencedor){
    h += `<p class="note">Aguarde a primeira pergunta. Todos respondem ao mesmo tempo; quem errar sai.</p>`;
  }
  return h + `</div></div>`;
}
function bindMataMata(){
  document.body.classList.toggle('pb', !!(est.mm && (est.mm.participantes || []).some(p => p.pid === pid && !p.vivo)));
  document.querySelectorAll('[data-mm]').forEach(b => b.onclick = () => {
    const mm = est.mm, k = 'mm' + mm.rodada;
    if(enviado[k] !== undefined) return;
    enviado[k] = +b.dataset.mm; enviar({ t: 'mm', alt: +b.dataset.mm, q: mm.id }); render();
  });
  const tr = $('#trocar'); if(tr) tr.onclick = trocar;
}

function telaFim(){
  const pos = est.ranking ? est.ranking.indexOf(me.equipe) : -1;
  const top = est.ranking ? est.equipes[est.ranking[0]] : null;
  let h = '';
  if(est.mm && est.mm.vencedor) h += `<div class="verdict ok">${est.mm.vencedor.pid === pid ? 'Você é o Auditor-Sócio da partida!' : 'Auditor-Sócio: ' + esc(est.mm.vencedor.nome)}</div>`;
  if(pos >= 0) h += `<div class="panel center"><div class="title">Fim de partida</div><div class="place">${pos + 1}º</div><p class="status">${pos === 0 ? (est.empate ? 'Empate no topo! O professor aplica o critério combinado.' : 'Parecer sem ressalva: vocês venceram!') : `Quem venceu: ${esc(top.nome)}.`}</p></div>`;
  else if(top) h += `<div class="panel center"><div class="title">Fim de partida</div><h2>${esc(top.nome)} venceu</h2></div>`;
  return h + placar();
}

/* ---------------- Imagem do pino (só o capitão) ---------------- */
function avatarLocal(){ return ls('trilha-avatar-' + salaCod + '-' + me.equipe) || ''; }
function avatarHtml(eq, lobby){
  const conf = eq.avatar;
  // confirmação da TV: limpa o pendente quando a TV já mostra a escolha
  if(avatarPend && ((avatarPend.tipo === null && !conf) || (conf && conf.tipo === avatarPend.tipo && (conf.tipo === 'img' || conf.v === avatarPend.v)))) avatarPend = null;
  const a = avatarPend ? (avatarPend.tipo === null ? null : avatarPend) : conf;
  const prev = !a ? esc(eq.sigla) : a.tipo === 'emoji' ? esc(a.v) : (avatarLocal() ? `<img src="${avatarLocal()}" alt="">` : '📷');
  return `<div class="panel av-box"><div class="av-top"><div class="av-prev">${prev}</div><div><b>Imagem do pino</b><div class="status">${lobby ? 'Escolha a imagem que vai andar no tabuleiro da TV.' : 'Troque quando quiser.'}${avatarEnviando || avatarPend ? ' Enviando para a TV…' : ''}${avatarErro ? ' ' + esc(avatarErro) : ''}</div></div></div>
    <div class="av-grid">${EMOJIS.map(e => `<button data-emo="${e}" class="${a && a.tipo === 'emoji' && a.v === e ? 'sel' : ''}">${e}</button>`).join('')}</div>
    <div class="av-acts"><button id="av-foto">Enviar uma foto</button>${a ? '<button id="av-sem">Usar a sigla</button>' : ''}${lobby ? '' : '<button id="av-fechar">Fechar</button>'}</div>
    <div class="status">A foto aparece para a turma inteira na TV. O professor pode remover.</div></div>`;
}
function bindAvatar(){
  document.querySelectorAll('[data-emo]').forEach(b => b.onclick = () => mandarAvatar({ tipo: 'emoji', v: b.dataset.emo }));
  const f = $('#av-foto'); if(f) f.onclick = () => $('#foto').click();
  const s = $('#av-sem'); if(s) s.onclick = () => mandarAvatar({ tipo: null });
  const ab = $('#av-abrir'); if(ab) ab.onclick = () => { avatarAberto = true; render(); };
  const fe = $('#av-fechar'); if(fe) fe.onclick = () => { avatarAberto = false; render(); };
}
let avatarT = null;
function mandarAvatar(a){
  avatarPend = a; avatarErro = '';
  enviar(Object.assign({ t: 'avatar' }, a));
  clearTimeout(avatarT);
  avatarT = setTimeout(() => {
    if(avatarPend){ avatarPend = null; avatarErro = est && est.versao !== Rede.VERSAO ? 'A TV está com uma versão antiga do jogo: recarregue a TV (Ctrl+Shift+R) e tente de novo.' : 'A TV não confirmou. Tente de novo.'; render(); }
  }, 6000);
  render();
}
/* Recorta a foto no centro e reduz para 96 px (fica com poucos KB) */
$('#foto').onchange = async e => {
  const file = e.target.files && e.target.files[0]; e.target.value = '';
  if(!file) return;
  avatarEnviando = true; avatarErro = ''; render();
  try{
    const url = URL.createObjectURL(file);
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const S = 96, cv = document.createElement('canvas'); cv.width = cv.height = S;
    const lado = Math.min(img.naturalWidth, img.naturalHeight);
    cv.getContext('2d').drawImage(img, (img.naturalWidth - lado) / 2, (img.naturalHeight - lado) / 2, lado, lado, 0, 0, S, S);
    URL.revokeObjectURL(url);
    let q = 0.75, data = cv.toDataURL('image/jpeg', q);
    while(data.length > 20000 && q > 0.3){ q -= 0.15; data = cv.toDataURL('image/jpeg', q); }
    ls('trilha-avatar-' + salaCod + '-' + me.equipe, data);
    mandarAvatar({ tipo: 'img', v: data });
  }catch(err){ avatarErro = 'Não deu para abrir essa imagem. Tente outra.'; }
  avatarEnviando = false; render();
};

function bindJogo(cap){
  bindAvatar();
  const tr = $('#trocar'); if(tr) tr.onclick = trocar;
  const d = $('#dado'); if(d) d.onclick = () => { d.disabled = true; enviar({ t: 'dado' }); };
  const c = est && est.carta;
  document.querySelectorAll('[data-alt]').forEach(b => b.onclick = () => {
    const i = +b.dataset.alt, key = c.id + ':' + c.who + ':' + c.wrong.length;
    if(enviado[key] !== undefined) return;
    enviado[key] = i; enviar({ t: 'resp', alt: i, carta: c.id }); render();
  });
  document.querySelectorAll('[data-vf]').forEach(b => b.onclick = () => {
    if(enviado[c.id] !== undefined) return;
    const val = b.dataset.vf === '1'; enviado[c.id] = val; enviar({ t: 'vf', val, carta: c.id }); render();
  });
  const rp = $('#repasse'); if(rp) rp.onclick = () => { rp.disabled = true; enviar({ t: 'repasse' }); };
}

if(Rede.modo !== 'off' && salaCod) conectar(); else render();
</script>
